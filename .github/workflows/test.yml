name: Test validate_dbc action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade "cantools>=40,<41" pytest
      - run: python -m pytest test/ -v

  action-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean fixture must pass
        uses: ./
        with:
          files: test/fixtures/valid.dbc

      - name: Broken fixture must fail
        id: bad
        continue-on-error: true
        uses: ./
        with:
          files: test/fixtures/error_syntax.dbc

      - name: Assert the broken fixture failed
        if: steps.bad.outcome != 'failure'
        run: |
          echo "Expected the action to FAIL on error_syntax.dbc, but it reported '${{ steps.bad.outcome }}'."
          exit 1
